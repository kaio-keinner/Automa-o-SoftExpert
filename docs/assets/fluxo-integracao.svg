<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo de integração entre SoftExpert e Obsidian</title>
  <desc id="desc">A extensão Chrome conecta SoftExpert, Obsidian e a API local em dois sentidos.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <linearGradient id="blue" x1="0" x2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity=".32"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7dd3fc"/></marker>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <circle cx="100" cy="60" r="140" fill="#1d4ed8" opacity=".15"/><circle cx="1100" cy="370" r="180" fill="#0891b2" opacity=".12"/>
  <text x="600" y="64" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Automação bidirecional de chamados</text>
  <text x="600" y="96" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="17">SoftExpert Suite  ↔  Extensão Chrome  ↔  Obsidian</text>
  <g filter="url(#shadow)">
    <rect x="70" y="150" width="270" height="170" rx="22" fill="#fff"/>
    <rect x="465" y="132" width="270" height="206" rx="22" fill="url(#blue)"/>
    <rect x="860" y="150" width="270" height="170" rx="22" fill="#fff"/>
  </g>
  <text x="205" y="205" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">SoftExpert</text>
  <text x="205" y="236" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#475569">Chamados e apontamentos</text>
  <text x="205" y="271" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#64748b">Tela ativa · Formulário</text>
  <text x="600" y="193" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#fff">Extensão Chrome</text>
  <text x="600" y="225" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#e0f2fe">Captura, fila e preenchimento</text>
  <text x="600" y="260" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#cffafe">Manifest V3 · JavaScript</text>
  <text x="995" y="205" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">Obsidian</text>
  <text x="995" y="236" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#475569">Notas Markdown</text>
  <text x="995" y="271" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#64748b">Local REST API · YAML</text>
  <path d="M342 193 C385 165,410 165,461 193" fill="none" stroke="#7dd3fc" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M858 286 C815 315,790 315,739 286" fill="none" stroke="#7dd3fc" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="402" y="147" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#bae6fd">captura dados</text>
  <text x="798" y="354" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#bae6fd">atualiza status</text>
</svg>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Google Sans", "Segoe UI", Roboto, sans-serif;
    }
    body {
      width: 410px;
      padding: 14px;
      margin: 0;
      background: #f8f9fa;
      color: #202124;
      -webkit-font-smoothing: antialiased;
    }

    /* Cabeçalho Minimalista */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 4px;
    }
    .app-title {
      font-size: 13px;
      font-weight: 600;
      color: #1a73e8;
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: -0.2px;
    }
    .app-subtitle {
      font-size: 11px;
      color: #5f6368;
      font-weight: 500;
    }

    /* Abas de Navegação Estilo Google Pills */
    .tab-bar {
      display: flex;
      gap: 4px;
      margin-bottom: 12px;
      background: #eef2f6;
      padding: 3px;
      border-radius: 10px;
    }
    .tab-btn {
      flex: 1;
      padding: 8px 12px;
      border: none;
      background: transparent;
      color: #5f6368;
      font-size: 11.5px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .tab-btn svg {
      transition: transform 0.2s ease;
    }
    .tab-btn:hover {
      color: #202124;
      background: rgba(255, 255, 255, 0.5);
    }
    .tab-btn.active {
      background: #ffffff;
      color: #1a73e8;
      box-shadow: 0 1px 3px rgba(60, 64, 67, 0.12), 0 1px 2px rgba(60, 64, 67, 0.08);
    }
    .tab-btn.active svg {
      transform: scale(1.05);
    }

    /* Badges Minimalistas */
    .badge {
      font-size: 10.5px;
      background: #e8f0fe;
      color: #1a73e8;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .badge-success { background: #e6f4ea; color: #137333; }
    .badge-warning { background: #fef7e0; color: #b06000; }
    .badge-neutral { background: #f1f3f4; color: #5f6368; }

    /* Cards e Containers */
    .card {
      background: #ffffff;
      border: 1px solid #e8eaed;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      font-size: 12px;
      box-shadow: 0 1px 2px rgba(60, 64, 67, 0.05);
      transition: border-color 0.2s ease;
    }
    .card:hover {
      border-color: #dadce0;
    }
    .card-row {
      margin-bottom: 8px;
    }
    .card-row:last-child {
      margin-bottom: 0;
    }
    .label {
      font-size: 11px;
      font-weight: 600;
      color: #5f6368;
      display: block;
      margin-bottom: 3px;
      letter-spacing: 0.1px;
    }
    .val-text {
      color: #202124;
      font-weight: 500;
      word-break: break-all;
      font-size: 12px;
    }

    /* Inputs, Selects e Textareas */
    input[type="text"], input[type="password"], textarea, select {
      width: 100%;
      font-size: 11.5px;
      padding: 7px 10px;
      border: 1px solid #dadce0;
      border-radius: 6px;
      background: #f8f9fa;
      color: #202124;
      transition: all 0.15s ease;
    }
    input:focus, textarea:focus, select:focus {
      outline: none;
      background: #ffffff;
      border-color: #1a73e8;
      box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.15);
    }
    textarea {
      height: 68px;
      resize: vertical;
      line-height: 1.4;
    }

    /* Painel Colapsável de Configuração */
    .config-box {
      font-size: 11.5px;
      margin-bottom: 10px;
      padding: 9px 12px;
      background: #ffffff;
      border-radius: 8px;
      border: 1px solid #e8eaed;
      transition: border-color 0.2s ease;
    }
    .config-header {
      font-weight: 600;
      color: #3c4043;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }
    .config-header-title {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #3c4043;
    }
    .chevron-wrapper {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #5f6368;
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .chevron-wrapper.rotated {
      transform: rotate(180deg);
    }

    /* Botão de Ícone Minimalista */
    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      color: #5f6368;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }
    .icon-btn:hover {
      background: #f1f3f4;
      color: #1a73e8;
      transform: rotate(30deg);
    }

    /* Grupos de Botões e Ações */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 10px;
    }
    button.action-btn {
      width: 100%;
      padding: 8px 14px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 11.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: all 0.15s ease;
      letter-spacing: 0.1px;
    }
    button.action-btn:active {
      transform: scale(0.985);
    }

    .btn-primary {
      background: #1a73e8;
      color: #ffffff;
      box-shadow: 0 1px 2px rgba(26, 115, 232, 0.2);
    }
    .btn-primary:hover {
      background: #1557b0;
      box-shadow: 0 1px 3px rgba(26, 115, 232, 0.35);
    }

    .btn-success {
      background: #1e8e3e;
      color: #ffffff;
      box-shadow: 0 1px 2px rgba(30, 142, 62, 0.2);
    }
    .btn-success:hover {
      background: #137333;
      box-shadow: 0 1px 3px rgba(30, 142, 62, 0.35);
    }

    .btn-turbo {
      background: #5e35b1;
      color: #ffffff;
      box-shadow: 0 1px 2px rgba(94, 53, 177, 0.25);
    }
    .btn-turbo:hover {
      background: #512da8;
      box-shadow: 0 1px 3px rgba(94, 53, 177, 0.35);
    }

    .btn-secondary {
      background: #f1f3f4;
      color: #3c4043;
      border: 1px solid #dadce0;
    }
    .btn-secondary:hover {
      background: #e8eaed;
      color: #202124;
    }

    /* Animação Minimalista de Injeção de Dados */
    .injection-indicator {
      margin-top: 10px;
      background: #ffffff;
      border: 1px solid #dadce0;
      border-radius: 8px;
      padding: 9px 12px;
      box-shadow: 0 1px 3px rgba(60, 64, 67, 0.08);
      animation: fadeIn 0.2s ease-out;
    }
    .injection-track {
      width: 100%;
      height: 4px;
      background: #e8f0fe;
      border-radius: 2px;
      overflow: hidden;
      position: relative;
      margin-bottom: 7px;
    }
    .injection-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 45%;
      background: linear-gradient(90deg, #1a73e8, #4285f4, #1a73e8);
      border-radius: 2px;
      animation: indeterminate 1.3s infinite ease-in-out;
    }
    @keyframes indeterminate {
      0% { left: -45%; width: 45%; }
      50% { left: 35%; width: 55%; }
      100% { left: 100%; width: 45%; }
    }
    .injection-status {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 11px;
      color: #1a73e8;
      font-weight: 600;
    }
    .spin-icon {
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Toast de Status */
    .status {
      margin-top: 9px;
      font-size: 11.5px;
      font-weight: 500;
      padding: 8px 12px;
      border-radius: 8px;
      display: none;
      align-items: center;
      gap: 8px;
      line-height: 1.35;
      animation: fadeIn 0.2s ease-out;
    }
    .status svg {
      flex-shrink: 0;
    }
    .status.sucesso {
      background: #e6f4ea;
      color: #137333;
      border: 1px solid #ceead6;
      display: flex;
    }
    .status.erro {
      background: #fce8e6;
      color: #c5221f;
      border: 1px solid #fad2cf;
      display: flex;
    }
    .status.info {
      background: #e8f0fe;
      color: #1a73e8;
      border: 1px solid #d2e3fc;
      display: flex;
    }
  </style>
</head>
<body>
  <!-- Header da Aplicação -->
  <div class="app-header">
    <div class="app-title">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm7 13H5v-.23c0-.62.28-1.2.76-1.58C7.47 15.82 9.64 15 12 15s4.53.82 6.24 2.19c.48.38.76.97.76 1.58V19z"/>
      </svg>
      <span>SoftExpert N1</span>
    </div>
    <div class="app-subtitle">Sankhya Suporte</div>
  </div>

  <!-- Abas de Navegação -->
  <div class="tab-bar">
    <button class="tab-btn active" id="tabBtnCapturar">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor">
        <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/>
      </svg>
      <span>Capturar Chamado</span>
    </button>
    <button class="tab-btn" id="tabBtnApontar">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor">
        <path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/>
      </svg>
      <span>Lançar Apontamentos</span>
    </button>
  </div>

  <!-- Painel Colapsável de Configurações -->
  <div class="config-box">
    <div class="config-header" id="toggleConfig">
      <div class="config-header-title">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor">
          <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
        </svg>
        <span>Configuração Obsidian API</span>
      </div>
      <span id="iconToggle" class="chevron-wrapper">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
          <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/>
        </svg>
      </span>
    </div>
    <div id="configBody" style="margin-top: 10px; display: none;">
      <div style="margin-bottom: 6px;">
        <label class="label">API Key do Obsidian:</label>
        <input type="password" id="apiKey" value="0c0da5ffb4ad5fd30bbaf46fdf15bbc78211113402d2b8554cf1b257205244df">
      </div>
      <div style="display: flex; gap: 6px; margin-bottom: 6px;">
        <div style="flex: 1;">
          <label class="label">Porta:</label>
          <input type="text" id="apiPort" value="27124">
        </div>
        <div style="flex: 1.5;">
          <label class="label">Protocolo:</label>
          <select id="apiProtocol">
            <option value="https" selected>HTTPS (27124)</option>
            <option value="http">HTTP (27123)</option>
          </select>
        </div>
      </div>
      <div>
        <label class="label">Pasta no Vault (Obsidian):</label>
        <input type="text" id="vaultFolder" value="2 - Chamados/{MES} - {NOME_MES}" placeholder="Ex: 2 - Chamados/{MES} - {NOME_MES}">
      </div>
    </div>
  </div>

  <!-- ==================== ABA 1: CAPTURAR CHAMADO ==================== -->
  <div id="viewCapturar">
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <span style="font-weight: 700; color: #202124; font-size: 12.5px;">Dados da Tela do SoftExpert</span>
        <div style="display: flex; gap: 4px;">
          <span id="badgeTramites" class="badge" style="display: none; background: #e8f0fe; color: #1a73e8;"></span>
          <span id="badgeEtapa" class="badge badge-neutral">Execução</span>
        </div>
      </div>
      <div class="card-row">
        <span class="label">Número do Chamado:</span>
        <span class="val-text" id="dispNumero">Identificando...</span>
      </div>
      <div class="card-row">
        <span class="label">Título / Atividade:</span>
        <span class="val-text" id="dispTitulo">...</span>
      </div>
      <div class="card-row">
        <span class="label">Solicitante:</span>
        <input type="text" id="dispSolicitante" placeholder="Nome do solicitante">
      </div>
      <div class="card-row">
        <span class="label">Descrição do Problema:</span>
        <textarea id="dispDescricao" placeholder="Descrição ou erro"></textarea>
      </div>
    </div>

    <div class="btn-group">
      <button class="action-btn btn-primary" id="btnSalvarObsidian">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
          <path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/>
        </svg>
        <span>Criar Nota no Obsidian</span>
      </button>
      <button class="action-btn btn-secondary" id="btnCopiarMarkdown">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
          <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
        </svg>
        <span>Copiar Markdown Formatado</span>
      </button>
    </div>
  </div>

  <!-- ==================== ABA 2: LANÇAR APONTAMENTOS ==================== -->
  <div id="viewApontar" style="display: none;">
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
        <span class="label" style="margin: 0;">FILA DE APONTAMENTOS</span>
        <div style="display: flex; gap: 6px; align-items: center;">
          <span id="badgeQtdPendentes" class="badge badge-warning">0 pendentes</span>
          <button id="btnRecarregarPendentes" class="icon-btn" title="Recarregar do Obsidian">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor">
              <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
            </svg>
          </button>
        </div>
      </div>
      <div id="dispPastaLendo" style="font-size: 10.5px; color: #5f6368; margin-bottom: 6px; font-weight: 500;"></div>
      <select id="selChamadoPendente" style="font-weight: 500; padding: 7px 8px;">
        <option value="">Carregando chamados pendentes...</option>
      </select>
    </div>

    <!-- Card Colapsável dos Dados do Lançamento -->
    <div class="card" id="cardDetalhesApontamento">
      <div id="toggleDetalhesApontamento" style="display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none;">
        <div style="display: flex; align-items: center; gap: 6px;">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="#1a73e8">
            <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
          </svg>
          <span style="font-weight: 600; color: #1a73e8;">Dados do Lançamento</span>
          <span id="badgeItemIndex" class="badge badge-neutral">#1</span>
        </div>
        <span id="iconToggleDetalhes" class="chevron-wrapper">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/>
          </svg>
        </span>
      </div>
      
      <div id="detalhesApontamentoBody" style="margin-top: 10px; display: none;">
        <div style="display: flex; gap: 8px; margin-bottom: 6px;">
          <div style="flex: 1;">
            <label class="label">Chamado:</label>
            <input type="text" id="aptChamado" style="font-weight: 600; background: #f1f3f4;" readonly>
          </div>
          <div style="flex: 1.2;">
            <label class="label">Data Apontamento:*</label>
            <input type="text" id="aptData" placeholder="DD/MM/YYYY">
          </div>
        </div>

        <div style="display: flex; gap: 8px; margin-bottom: 6px;">
          <div style="flex: 1;">
            <label class="label">Hora Início:*</label>
            <input type="text" id="aptHoraInicio" placeholder="HH:MM">
          </div>
          <div style="flex: 1;">
            <label class="label">Hora Fim:*</label>
            <input type="text" id="aptHoraFim" placeholder="HH:MM">
          </div>
        </div>

        <div class="card-row">
          <label class="label">Atividade Executada:*</label>
          <textarea id="aptAtividade" style="height: 72px;" placeholder="Descrição do que foi feito"></textarea>
        </div>
      </div>
    </div>

    <!-- Indicador de Animação de Injeção de Dados -->
    <div id="injectionProgress" class="injection-indicator" style="display: none;">
      <div class="injection-track">
        <div class="injection-bar"></div>
      </div>
      <div class="injection-status">
        <svg class="spin-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5">
          <circle cx="12" cy="12" r="10" stroke="rgba(26,115,232,0.2)"/>
          <path d="M12 2a10 10 0 0 1 10 10" stroke="#1a73e8" stroke-linecap="round"/>
        </svg>
        <span id="injectionText">Injetando dados no SoftExpert...</span>
      </div>
    </div>

    <div class="btn-group">
      <button class="action-btn btn-primary" id="btnPreencherSE">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
          <path d="M11 21h-1l1-7H7.5c-.88 0-.33-.75-.31-.78C8.48 10.94 10.42 7.54 13.01 3h1l-1 7h3.51c.4 0 .62.19.4.66C12.98 17.07 11 21 11 21z"/>
        </svg>
        <span>Preencher Formulário no SE</span>
      </button>
      <button class="action-btn btn-success" id="btnMarcarApontado">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
        </svg>
        <span>Marcar como Apontado no Obsidian</span>
      </button>
      <button class="action-btn btn-turbo" id="btnPreencherEMarcar">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
          <path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/>
        </svg>
        <span>Preencher & Marcar Próximo</span>
      </button>
    </div>
  </div>

  <div class="status" id="msgStatus"></div>

  <script src="popup.js"></script>
</body>
</html>
